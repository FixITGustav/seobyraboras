# Decap CMS: the admin at /admin. Every save becomes a commit on GitHub,
# and Cloudflare Pages rebuilds the site automatically a minute later.
# All fields are optional: empty fields simply leave nothing on the page.

backend:
  name: github
  repo: FixITGustav/seobyraboras
  branch: main
  base_url: https://seobyraboras.se
  auth_endpoint: api/auth
  commit_messages:
    update: Uppdatera {{collection}} "{{slug}}" via CMS
    uploadMedia: Ladda upp "{{path}}"
    deleteMedia: Ta bort "{{path}}"
local_backend: true
locale: sv
site_url: https://seobyraboras.se
display_url: https://seobyraboras.se
media_folder: src/assets/uploads
public_folder: /src/assets/uploads
collections:
- name: sidor
  label: Sidor
  format: json
  editor:
    preview: false
  files:
  - name: hem
    label: Startsidan
    file: src/content/hem.json
    fields:
    - &id001
      label: SEO
      name: seo
      widget: object
      collapsed: false
      fields:
      - label: Title-tagg
        name: titel
        widget: string
        hint: Den blå rubriken i Googles sökresultat. Håll den under cirka 60 tecken. Lämnas den tom används H1 + " | Fix IT Webbyrå".
        required: false
      - label: Metabeskrivning
        name: beskrivning
        widget: text
        hint: Den grå texten under rubriken i sökresultatet. Sikta på 120 till 160 tecken. Lämnas den tom skriver Google en egen.
        required: false
      - label: Delningsbild
        name: delningsbild
        widget: image
        required: false
        choose_url: false
        hint: Visas när sidan delas på Facebook, LinkedIn eller i Slack. Helst 1200 × 630 pixlar. Lämna tom för att använda sajtens standardbild.
      - label: Alt-text för delningsbilden
        name: delningsbild_alt
        widget: string
        required: false
      required: false
    - label: Toppen av sidan
      name: hero
      widget: object
      fields:
      - label: H1
        name: h1
        widget: string
        hint: Sidans H1, den lilla gröna texten överst. Det här är rubriken Google läser som sidans huvudrubrik, så lägg sökordet här. Bara en H1 per sida.
        required: false
      - label: Stor rubrik (H2)
        name: rubrik
        widget: string
        hint: Den stora rubriken under H1. Ser ut som huvudrubrik men är en H2 i koden.
        required: false
      - label: Markerad del av stora rubriken
        name: rubrik_markering
        widget: string
        hint: Skriv exakt den del av stora rubriken som ska få den gröna markeringen. Lämna tom för ingen markering.
        required: false
      - label: Ingress
        name: ingress
        widget: text
        required: false
      - label: Knapptext
        name: knapp
        widget: string
        required: false
      - label: Förtroendepunkter
        name: fortroende
        widget: list
        summary: '{{fields.rubrik}}'
        fields:
        - label: Rubrik
          name: rubrik
          widget: string
          required: false
        - label: Undertext
          name: text
          widget: string
          required: false
        required: false
      required: false
    - label: Tjänster
      name: tjanster
      widget: object
      fields:
      - label: Överrubrik
        name: overrubrik
        widget: string
        required: false
      - label: Rubrik (H2)
        name: rubrik
        widget: string
        required: false
      - label: Ingress
        name: ingress
        widget: text
        required: false
      - label: Tjänstekort
        name: lista
        widget: list
        summary: '{{fields.rubrik}}'
        fields:
        - label: Rubrik (H3)
          name: rubrik
          widget: string
          required: false
        - label: Text
          name: text
          widget: text
          required: false
        - label: Typisk sökning
          name: sokning
          widget: string
          required: false
          hint: Visas längst ned på kortet.
        required: false
      required: false
    - label: Robotläget
      name: robot
      widget: object
      fields:
      - label: Överrubrik
        name: overrubrik
        widget: string
        required: false
      - label: Rubrik (H2)
        name: rubrik
        widget: string
        required: false
      - label: Text
        name: text
        widget: text
        required: false
      - label: Knapptext
        name: knapp
        widget: string
        required: false
      required: false
    - label: Så går det till
      name: process
      widget: object
      fields:
      - label: Överrubrik
        name: overrubrik
        widget: string
        required: false
      - label: Rubrik (H2)
        name: rubrik
        widget: string
        required: false
      - label: Ingress
        name: ingress
        widget: text
        required: false
      - label: Steg
        name: steg
        widget: list
        max: 4
        summary: '{{fields.rubrik}}'
        fields:
        - label: Rubrik (H3)
          name: rubrik
          widget: string
          required: false
        - label: Text
          name: text
          widget: text
          required: false
        required: false
      required: false
    - label: Borås-sektionen
      name: boras
      widget: object
      fields:
      - label: Överrubrik
        name: overrubrik
        widget: string
        required: false
      - label: Rubrik (H2)
        name: rubrik
        widget: string
        required: false
      - label: Text
        name: text
        widget: text
        hint: Lämna en tom rad mellan stycken.
        required: false
      - label: Bild
        name: bild
        widget: image
        required: false
        choose_url: false
        hint: Visas ovanför kartan. Liggande format fungerar bäst.
      - label: Alt-text för bilden
        name: bild_alt
        widget: string
        required: false
        hint: Beskriv vad bilden visar. Viktigt för SEO och tillgänglighet.
      required: false
    - label: Vanliga frågor
      name: faq
      widget: object
      fields:
      - label: Överrubrik
        name: overrubrik
        widget: string
        required: false
      - label: Rubrik (H2)
        name: rubrik
        widget: string
        required: false
      - label: Ingress
        name: ingress
        widget: text
        required: false
      - label: Frågor
        name: fragor
        widget: list
        summary: '{{fields.fraga}}'
        hint: De fyra första visas direkt. Resten dyker upp när besökaren öppnar en fråga.
        fields:
        - label: Fråga
          name: fraga
          widget: string
          required: false
        - label: Svar
          name: svar
          widget: text
          required: false
        required: false
      required: false
    - label: Avslutning
      name: cta
      widget: object
      fields:
      - label: Rubrik (H2)
        name: rubrik
        widget: string
        required: false
      - label: Text
        name: text
        widget: text
        required: false
      - label: Knapptext
        name: knapp
        widget: string
        required: false
      required: false
  - name: om-oss
    label: Om oss
    file: src/content/om-oss.json
    fields:
    - *id001
    - label: Toppen av sidan
      name: hero
      widget: object
      fields:
      - label: H1
        name: h1
        widget: string
        hint: Sidans H1, den lilla gröna texten överst. Det här är rubriken Google läser som sidans huvudrubrik, så lägg sökordet här. Bara en H1 per sida.
        required: false
      - label: Stor rubrik (H2)
        name: rubrik
        widget: string
        hint: Den stora rubriken under H1. Ser ut som huvudrubrik men är en H2 i koden.
        required: false
      - label: Markerad del av stora rubriken
        name: rubrik_markering
        widget: string
        hint: Skriv exakt den del av stora rubriken som ska få den gröna markeringen. Lämna tom för ingen markering.
        required: false
      - label: Ingress
        name: ingress
        widget: text
        required: false
      required: false
    - label: Personer
      name: personer
      widget: list
      summary: '{{fields.namn}}'
      fields:
      - label: Namn
        name: namn
        widget: string
        required: false
      - label: Roll
        name: roll
        widget: string
        required: false
      - label: Porträtt
        name: bild
        widget: image
        required: false
        choose_url: false
        hint: Kvadratisk bild fungerar bäst. Utan bild visas första bokstaven i namnet.
      - label: Alt-text för porträttet
        name: bild_alt
        widget: string
        required: false
      - label: Fakta
        name: fakta
        widget: list
        summary: '{{fields.etikett}}: {{fields.text}}'
        fields:
        - label: Etikett
          name: etikett
          widget: string
          required: false
        - label: Text
          name: text
          widget: string
          required: false
        required: false
      required: false
    - label: Historien
      name: historia
      widget: object
      fields:
      - label: Överrubrik
        name: overrubrik
        widget: string
        required: false
      - label: Rubrik (H2)
        name: rubrik
        widget: string
        required: false
      - label: Ingress
        name: ingress
        widget: text
        required: false
      - label: Kapitel
        name: kapitel
        widget: list
        summary: '{{fields.tid}}: {{fields.rubrik}}'
        fields:
        - label: Sökfras
          name: sokfras
          widget: string
          hint: Det som visas som förslag i sökrutan, gärna med små bokstäver.
          required: false
        - label: Tid
          name: tid
          widget: string
          hint: Till exempel 2021 eller Sommaren 2021.
          required: false
        - label: Rubrik (H3)
          name: rubrik
          widget: string
          required: false
        - label: Text
          name: text
          widget: text
          required: false
        required: false
      required: false
    - label: Så är vi att jobba med
      name: varden
      widget: object
      fields:
      - label: Överrubrik
        name: overrubrik
        widget: string
        required: false
      - label: Rubrik (H2)
        name: rubrik
        widget: string
        required: false
      - label: Punkter
        name: lista
        widget: list
        summary: '{{fields.rubrik}}'
        fields:
        - label: Rubrik (H3)
          name: rubrik
          widget: string
          required: false
        - label: Text
          name: text
          widget: text
          required: false
        required: false
      required: false
    - label: Avslutning
      name: cta
      widget: object
      fields:
      - label: Rubrik (H2)
        name: rubrik
        widget: string
        required: false
      - label: Text
        name: text
        widget: text
        required: false
      - label: Knapptext
        name: knapp
        widget: string
        required: false
      required: false
  - name: kontakt
    label: Kontakt
    file: src/content/kontakt.json
    fields:
    - *id001
    - label: Toppen av sidan
      name: hero
      widget: object
      fields:
      - label: H1
        name: h1
        widget: string
        hint: Sidans H1, den lilla gröna texten överst. Det här är rubriken Google läser som sidans huvudrubrik, så lägg sökordet här. Bara en H1 per sida.
        required: false
      - label: Stor rubrik (H2)
        name: rubrik
        widget: string
        hint: Den stora rubriken under H1. Ser ut som huvudrubrik men är en H2 i koden.
        required: false
      - label: Markerad del av stora rubriken
        name: rubrik_markering
        widget: string
        hint: Skriv exakt den del av stora rubriken som ska få den gröna markeringen. Lämna tom för ingen markering.
        required: false
      - label: Ingress
        name: ingress
        widget: text
        required: false
      required: false
    - label: Brevet
      name: brev
      widget: object
      fields:
      - label: Hälsning
        name: halsning
        widget: string
        required: false
      - label: Knapptext
        name: knapp
        widget: string
        required: false
      - label: Integritetstext
        name: integritet
        widget: string
        hint: Ordet integritetspolicy blir automatiskt en länk.
        required: false
      required: false
    - label: Tack-meddelandet
      name: tack
      widget: object
      fields:
      - label: Rubrik
        name: rubrik
        widget: string
        required: false
      - label: Text
        name: text
        widget: text
        required: false
      required: false
    - label: Text under förhandsvisningen
      name: forhandsvisning
      widget: text
      required: false
- name: installningar
  label: Inställningar
  format: json
  editor:
    preview: false
  files:
  - name: installningar
    label: Företagsuppgifter och standardbild
    file: src/content/installningar.json
    fields:
    - label: Företagsnamn
      name: foretag
      widget: string
      required: false
    - label: Juridiskt namn
      name: juridiskt_namn
      widget: string
      required: false
    - label: Organisationsnummer
      name: orgnr
      widget: string
      required: false
    - label: Telefon
      name: telefon
      widget: string
      hint: Skriv som det ska visas, till exempel 073-543 43 71.
      required: false
    - label: E-post
      name: epost
      widget: string
      required: false
    - label: Gatuadress
      name: gatuadress
      widget: string
      required: false
    - label: Postnummer
      name: postnummer
      widget: string
      required: false
    - label: Ort
      name: ort
      widget: string
      required: false
    - label: Text bredvid loggan
      name: logo_undertext
      widget: string
      required: false
    - label: Text i sidfoten
      name: sidfot_text
      widget: text
      required: false
    - label: Länk till integritetspolicy
      name: integritetspolicy
      widget: string
      required: false
    - label: Standardbild vid delning
      name: delningsbild
      widget: image
      required: false
      choose_url: false
      hint: Används på sidor som saknar egen delningsbild. Helst 1200 × 630 pixlar.
    - label: Alt-text för standardbilden
      name: delningsbild_alt
      widget: string
      required: false
    - label: Google Analytics mät-ID
      name: google_analytics_id
      widget: string
      required: false
      hint: Börjar med G-, till exempel G-4NQDCMTJ9L. Lämna tomt för att stänga av Google Analytics. Då försvinner också cookiebaren.
    - label: Cookiebar
      name: cookiebar
      widget: object
      required: false
      collapsed: true
      hint: Visas bara när ett mät-ID är ifyllt. Knapparna Acceptera och Neka ser alltid likadana ut, eftersom ett nej ska vara lika enkelt som ett ja.
      fields:
      - label: Rubrik
        name: rubrik
        widget: string
        required: false
      - label: Text
        name: text
        widget: text
        required: false
        hint: Berätta vad kakorna används till. Var konkret.
      - label: 'Knapp: acceptera'
        name: acceptera
        widget: string
        required: false
      - label: 'Knapp: neka'
        name: neka
        widget: string
        required: false
      - label: Länktext till integritetspolicyn
        name: las_mer
        widget: string
        required: false
        hint: Länken går till adressen under Länk till integritetspolicy.
      - label: Länktext i sidfoten
        name: installningar_lank
        widget: string
        required: false
        hint: Länken där besökaren kan ändra sitt val i efterhand.
